name: Linux CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-debug:
    name: Linux Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Record environment
        run: |
          uname -a
          cat /etc/os-release
          cmake --version
          c++ --version
          git --version

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Build Debug
        run: ./scripts/build_linux.sh Debug

      - name: Verify TCP targets Debug
        run: cmake --build build/linux-debug --target iaisf_tcp iaisf_tcp_tests --parallel

      - name: Test Debug
        run: ./scripts/test_linux.sh Debug

  linux-release:
    name: Linux Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Build Release
        run: ./scripts/build_linux.sh Release

      - name: Verify TCP targets Release
        run: cmake --build build/linux-release --target iaisf_tcp iaisf_tcp_tests --parallel

      - name: Test Release
        run: ./scripts/test_linux.sh Release

      - name: Smoke Release
        run: ./scripts/smoke_linux.sh
