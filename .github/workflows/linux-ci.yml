name: Linux CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-debug:
    name: Linux Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Record environment
        run: |
          uname -a
          cat /etc/os-release
          cmake --version
          c++ --version
          git --version

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Build Debug
        run: ./scripts/build_linux.sh Debug

      - name: Verify application and service targets Debug
        run: |
          cmake --build build/linux-debug \
            --target iaisf_application_core iaisf_application_core_tests iaisf_application_artifacts iaisf_application_artifact_result_tests iaisf_application_repository iaisf_application_repository_tests iaisf_application_contract iaisf_application_contract_tests iaisf_application_api_primitives iaisf_application_api_primitives_tests iaisf_application_runtime iaisf_application_runtime_tests iaisf_http_core iaisf_http_core_tests iaisf_http iaisf_http_tests iaisf_task iaisf_task_tests iaisf_plugin iaisf_plugin_tests iaisf_task_api iaisf_task_api_tests iaisf_service iaisf_service_tests \
            --parallel

      - name: Test Debug
        run: ./scripts/test_linux.sh Debug

  linux-release:
    name: Linux Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Build Release
        run: ./scripts/build_linux.sh Release

      - name: Verify application and service targets Release
        run: |
          cmake --build build/linux-release \
            --target iaisf_application_core iaisf_application_core_tests iaisf_application_artifacts iaisf_application_artifact_result_tests iaisf_application_repository iaisf_application_repository_tests iaisf_application_contract iaisf_application_contract_tests iaisf_application_api_primitives iaisf_application_api_primitives_tests iaisf_application_runtime iaisf_application_runtime_tests iaisf_http_core iaisf_http_core_tests iaisf_http iaisf_http_tests iaisf_task iaisf_task_tests iaisf_plugin iaisf_plugin_tests iaisf_task_api iaisf_task_api_tests iaisf_service iaisf_service_tests \
            --parallel

      - name: Test Release
        run: ./scripts/test_linux.sh Release

      - name: Smoke Release
        run: ./scripts/smoke_linux.sh
